<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Видео</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            /* Важно для iOS */
            -webkit-playsinline: true;
            playsinline: true;
        }

        #play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: opacity 0.3s;
            /* Для iOS Safari */
            -webkit-tap-highlight-color: transparent;
        }

        #play-overlay::after {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #000;
            margin-left: 5px;
        }

        #play-overlay:hover {
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="myVideo" preload="metadata" muted playsinline webkit-playsinline>
            <source src="combined.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
        <div id="play-overlay"></div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const playOverlay = document.getElementById('play-overlay');

        // Проверка на iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        playOverlay.addEventListener('click', () => {
            video.play().then(() => {
                playOverlay.style.display = 'none';
            }).catch(err => {
                console.log('Ошибка воспроизведения:', err);
                // Если ошибка — пробуем с muted
                if (!video.muted) {
                    video.muted = true;
                    video.play();
                }
            });
        });

        // Для iOS — добавляем обработчик touchend
        playOverlay.addEventListener('touchend', (e) => {
            e.preventDefault();
            video.play().then(() => {
                playOverlay.style.display = 'none';
            }).catch(err => {
                if (!video.muted) {
                    video.muted = true;
                    video.play();
                }
            });
        });

        video.addEventListener('ended', () => {
            playOverlay.style.display = 'flex';
        });

        video.addEventListener('click', () => {
            if (video.paused) {
                video.play().then(() => {
                    playOverlay.style.display = 'none';
                });
            }
        });

        video.addEventListener('play', () => {
            playOverlay.style.display = 'none';
        });

        video.addEventListener('pause', () => {
            if (!video.ended) {
                playOverlay.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
